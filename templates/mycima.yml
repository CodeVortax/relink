# Template: cima.my-cima.net (MyCima)
# Written by hand from tools/probe.py reports (episode bb54280c0, The Mentalist S03E17).
# Chain proven so far:
#   play.php?vid=ID  ->  server list (data-embed)  ->  vipserver /d/{code}.html (qualities)
#   ->  /d/{code}_h  ->  POST form F1  ->  "Direct Download Link" (signed .mp4, ~12 h)
# See `relink/engine.py` for the step language.

name: mycima
# The domain rotates (root redirects through /1unj and other w*.my-cima.net names), so the
# match accepts any cima/my-cima host and every step works from the URL you give it.
match: '^https?://[\w.-]*my-cima\.[a-z]+/(?:play|watch|downloads)\.php\?vid=(?P<vid>\w+)'

# Plain urllib with a mobile Chrome User-Agent gets a normal page; bare curl got a
# Cloudflare "Just a moment" challenge. If a challenge appears: --cookie "cf_clearance=...".
request:
  headers:
    Accept-Language: "en-US,en;q=0.8,ar;q=0.6"
  retries: 6        # the connection is flaky: "Connection refused", then it works
  timeout: 90

site:
  root: "https://cima.my-cima.net/"   # followed to find the live domain when searching

server_priority: [vipserver]          # the first one that works wins; others are fallbacks

# ---- 1. read the episode page ----------------------------------------------------------
servers:
  steps:
    - get: "{origin}/play.php?vid={vid}"
    - find: {regex: '<title>(?P<title>.*?)</title>', dotall: true, strip: [title], required: false}
    # one <li id="server_Name" data-embed="<iframe src='EMBED'..."> per watch server.
    # The attribute may be stored raw or HTML-escaped, so both forms are accepted.
    - find:
        regex: 'id="server_(?P<name>\w+)"\s+data-embed=["''](?:<|&lt;)iframe[^>]*?src=(?:''|&#0?39;|&quot;|\\")(?P<embed>https?://.+?)(?:''|&#0?39;|&quot;|\\")'
        all: true
        as: servers

# ---- 2. per download host: server -> direct file link ---------------------------------
# Every host needs its own small adapter. Only vipserver is studied so far.
hosts:
  vipserver:
    steps:
      # embed https://vipserver.liiivideo.com/embed-{code}.html -> download page /d/{code}.html
      - find: {from: embed, regex: '/embed-(?P<code>\w+)\.html'}
      - get: {url: "{embed_origin}/d/{code}.html", referer: "{origin}/downloads.php?vid={vid}"}
      # qualities are links /d/{code}_h (HD 1280x720) and /d/{code}_l (low 640x360)
      - find:
          regex: 'href="[^"]*/d/{code}_(?P<q>\w)(?:\.html)?"[^>]*>(?P<label>.*?)</a>'
          dotall: true
          strip: [label]
          all: true
          as: qualities
      - choose:
          from: qualities
          key: q
          as: pick
          prefer:
            best: [h, n, l]
            hd:   [h, n, l]
            low:  [l, n, h]
      - get: "{embed_origin}/d/{code}_{pick.q}"
      # one POST form (id F1, action "" = same URL) with hidden op/id/mode/hash. The hash is
      # minted on every page load, so the page and the POST must happen together.
      - form: {}
      # the reply holds <a href="DIRECT">Direct Download Link</a>; the second find is a
      # fallback that takes any media-looking URL.
      - find:
          regex: '<a\b[^>]*?href="(?P<direct>https?://[^"]+)"[^>]*>(?:\s|<[^>]+>)*Direct Download Link'
          dotall: true
          required: false
      - find:
          regex: '(?P<direct>https?://[^\s"''<>]+?\.(?:mp4|mkv|m3u8)[^\s"''<>]*)'
          unless: direct
    result: "{direct}"
  # Seen on the downloads page, not studied yet (embed code -> download page is the same
  # code with a different path):
  #   mixdrop    https://mixdrop.top/f/{code}         abstream   https://abstream.to/d/{code}
  #   minochinos https://minochinos.com/d/{code}      hgcloud    https://hgcloud.to/d/{code}
  #   bysebuho   https://bysebuho.com/d/{code}
  # vkvideo and vidmoly have no download link.

# ---- 3. search (small API) -------------------------------------------------------------
# Live search used by the site's box: POST, returns up to 10 EPISODE items (not series).
search:
  steps:
    - post: {url: "{origin}/ajax-search.php", form: {queryString: "{query}"}, ajax: true}
    - find:
        regex: '<li onClick="fill\(''(?P<title>.*?)''\);" data-video-id="(?P<vid>\w+)"'
        dotall: true
        strip: [title]
        all: true
        as: results
  result_url: "{origin}/watch.php?vid={vid}"

# ---- notes for later --------------------------------------------------------------------
# Series: season tabs openCity(event,'Season0'..'Season6'), newest season first; every
#   episode is <a href=".../watch.php?vid=ID">الحلقة N</a> inside its season block.
#   Prev/next links are labelled "الحلقة السابقة N" / "الحلقة التالية N".
# Browse: episodes.php, topvideos.php, category.php?cat=SLUG, tag.php?t=SLUG,
#   search.php?keywords=QUERY (full page; not studied).
# Ads to ignore: openLink() random pop-ups, the popup_shown cookie.
